  <meta property="og:image" content="assets/img/compartilhar-fjjce.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="FJJCE">
  <meta property="og:locale" content="pt_BR">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="preload" href="assets/fontes/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/estilo.css">

  <script src="assets/js/componentes.js" defer></script>
  <script src="assets/js/util.js" defer></script>
  <script src="assets/js/eventos-dados.js" defer></script>

<body>
  <header data-incluir="partials/cabecalho.html"></header>

  <main id="conteudo">
    <section class="pagina-topo" aria-labelledby="pagina-titulo">
      <div class="container">
        <h1 id="pagina-titulo" class="pagina-topo__titulo">Campeonatos</h1>
        <p class="pagina-topo__texto">Calendário da federação. As inscrições são feitas pelo iLutas; editais, chaves e resultados ficam na página de cada campeonato.</p>
      </div>
    </section>

    <div class="faixa" aria-hidden="true"><span></span></div>

    <section class="secao secao--compacta" aria-labelledby="proximos-titulo">
      <div class="container">
        <div class="secao__cabeca">
          <h2 id="proximos-titulo">Próximos</h2>
        </div>
        <ol class="calendario" data-lista="proximos">
          <li class="carregando">Carregando campeonatos…</li>
        </ol>
      </div>
    </section>

    <section class="secao secao--cinza" aria-labelledby="encerrados-titulo" data-bloco="encerrados" hidden>
      <div class="container">
        <div class="secao__cabeca">
          <h2 id="encerrados-titulo">Encerrados</h2>
          <p>Resultados e chaves dos campeonatos anteriores.</p>
        </div>
        <div data-lista="encerrados"></div>
      </div>
    </section>
  </main>

  <footer class="rodape" data-incluir="partials/rodape.html"></footer>
